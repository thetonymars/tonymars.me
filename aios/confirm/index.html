<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOS — подтверждение</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fff; color: #6b7280; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    p { font-size: 1.125rem; }
  </style>
</head>
<body>
  <p>Подтверждаем почту…</p>
  <script>
    // Static bridge: confirm the token on the engine, then go to the thank-you page.
    // We must WAIT for confirm to succeed before redirecting — confirm mints the
    // license, and the thank-you page asks for the install prompt right after.
    const CONFIRM = "https://aios-skills.vercel.app/confirm";
    const t = new URLSearchParams(location.search).get("t") || "";
    const dest = "/aios/thank-you" + (t ? "?t=" + encodeURIComponent(t) : "");
    const msg = document.querySelector("p");
    async function confirmOnce() {
      try { const r = await fetch(`${CONFIRM}?t=${encodeURIComponent(t)}`); return r.ok; }
      catch (e) { return false; }
    }
    async function run() {
      if (!t) { location.replace("/aios"); return; }
      // confirm mints the license — wait for success before going to the prompt page.
      // one retry to ride out a transient hiccup on this conversion-critical step.
      if (await confirmOnce() || await confirmOnce()) { location.replace(dest); return; }
      msg.textContent = "Не удалось подтвердить. Обнови страницу или запроси ссылку заново.";
    }
    run();
  </script>
</body>
</html>
