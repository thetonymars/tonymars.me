<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOS — подтверждение</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fff; color: #6b7280; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    p { font-size: 1.125rem; }
  </style>
</head>
<body>
  <p>Подтверждаем почту…</p>
  <script>
    // Static bridge replacing the old /aios/confirm server route:
    // confirm the token on the engine (best-effort), then go to the thank-you page.
    const CONFIRM = "https://aios-skills.vercel.app/confirm";
    const t = new URLSearchParams(location.search).get("t") || "";
    const dest = "/aios/thank-you" + (t ? "?t=" + encodeURIComponent(t) : "");
    async function run() {
      if (t) {
        try { await fetch(`${CONFIRM}?t=${encodeURIComponent(t)}`); } catch (e) {}
      }
      location.replace(dest);
    }
    run();
  </script>
</body>
</html>
