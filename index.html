<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tony Mars — Coming soon</title>
  <meta name="description" content="Under construction. AI tools for marketing.">
  <meta property="og:title" content="Tony Mars — Coming soon">
  <meta property="og:description" content="Under construction. AI tools for marketing.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tonymars.me">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script src="/assets/js/layout.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 40px 24px;
      text-align: center;
    }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: #003561; margin-bottom: 32px; }
    .image { max-width: 480px; width: 100%; margin-bottom: 40px; }
    .image img { width: 100%; height: auto; display: block; }
    h1 { font-size: 48px; font-weight: 900; letter-spacing: -2px; line-height: 1.1; color: #1f2426; margin: 0 0 16px; }
    .subtitle { font-size: 18px; color: #495257; line-height: 1.6; margin: 0 0 40px; }
    .socials { display: flex; gap: 12px; }
    .btn { display: inline-flex; align-items: center; padding: 14px 28px; border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; transition: all 0.15s; }
    .btn-primary { background: #0073b9; color: #fff; }
    .btn-primary:hover { background: #005fa0; }
    .btn-secondary { background: #fff; color: #0073b9; border: 2px solid #0073b9; }
    .btn-secondary:hover { background: #f0f7fc; }
    @media (max-width: 768px) {
      h1 { font-size: 32px; letter-spacing: -1px; }
      .subtitle { font-size: 16px; }
      .socials { flex-direction: column; align-items: center; }
      .image { max-width: 320px; }
    }
  </style>
</head>
<body>
  <div class="logo">TONY MARS</div>
  <div class="image">
    <img src="/assets/img/under-construction.jpg" alt="Under construction">
  </div>
  <h1>Under construction</h1>
</body>
</html>
